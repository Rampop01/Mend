# Mend Incident War-Room: Three specialized agents (recon, forge, guard)
# collaborating with an on-call human engineer in a shared Switch room.
#
# Compatible with Switch Console ("Create from template" / Import page)
# following the official sandbox-quantum/switch template specification (v1).
version: 1

params:
  team:
    type: string
    description: Prefix for every agent and room name this template creates
    default: mend
    pattern: "[a-z][a-z0-9-]*"
  provider:
    type: provider
    description: Which coding agent harness backs the Mend squad. The first one installed is chosen.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: The machine the agents run on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Working directory containing the target microservice and test suite.
    default: "{$agents_dir}/{agent}"
    input: advanced
  bridge:
    type: bridge
    description: Messaging platform where the room is mirrored (Telegram, Slack, Discord, Mattermost).
    default: [Telegram, $first]

agents:
  - name: "{team}-recon"
    description: Intercepts production 500 tracebacks, inspects Python AST & stack frames, and routes root-cause context
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are @{team}-recon, the Incident Forensics & AST Inspector for the team.
      When an unhandled exception or bug report arrives in the room:

      1. Parse the traceback and inspect the target source file's Abstract Syntax Tree (AST) in your working directory.
      2. Post a concise forensics summary stating the exact exception type, file path, function name, line number, and failing statement.
      3. Hand off directly to @{team}-forge by addressing it by name (`@{team}-forge`) with the root-cause context and failing payload.

      Never guess a line number or stack frame you did not verify on disk.

  - name: "{team}-forge"
    description: Synthesizes minimal unified git diffs and executes the real unittest suite in an isolated workspace
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are @{team}-forge, the Autonomous Patch & Unittest Verification Agent.
      When @{team}-recon hands you a verified root-cause report:

      1. Synthesize the smallest surgical code fix that resolves the root cause without breaking existing behavior.
      2. Run `python3 -m unittest discover -s tests -v` before and after applying the candidate patch.
      3. Post the unified `git diff` and the exact unittest pass/fail output into the room, then address `@{team}-guard` to run the Switch Trust security audit.

  - name: "{team}-guard"
    description: Runs Switch Trust AST & DLP safety guardrails and gates zero-downtime hotfix deployment on human approval
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    instructions: |
      You are @{team}-guard, the Switch Trust Security Auditor & Hotfix Deployment Agent.
      When @{team}-forge posts a candidate patch and passing test report:

      1. Audit the patch against Switch Trust Guardrails:
         - Python AST syntax validity
         - Zero forbidden dynamic execution calls (`eval`, `exec`, `os.system`, `subprocess.Popen`)
         - Credential and token DLP scan
         - Surgical blast-radius threshold (<= 45 lines modified)
      2. Report the Switch Trust score in the room and pause at the Human-in-the-Loop Gate, asking `{$creator}` to approve (`ship it` or inline button).
      3. Only after `{$creator}` explicitly approves, apply the patch, hot-reload the service, replay the failed transaction, and post the `HTTP 200 OK` ledger verification receipt.

room:
  name: "{team}-prod-incidents"
  description: Autonomous incident forensics, surgical patching & human-gated hotfix deployment room
  bridge: "{bridge}"
  agents: ["{team}-recon", "{team}-forge", "{team}-guard"]
  users: ["{$creator}"]

kickoff: |
  @{team}-recon, @{team}-forge, and @{team}-guard: welcome to the `{team}-prod-incidents` war-room with {$creator}.
  @{team}-recon: introduce the pipeline in one short paragraph and confirm you are monitoring `services/checkout_engine.py` for live exceptions.

