# Mend Hotfix Workroom: A room template pairing @mend-forge (patch coder)
# and @mend-guard (Switch Trust reviewer) with a mandatory human approval gate.
params:
  incident_id:
    type: string
    description: Short incident identifier (e.g. INC-61339)
  recon_agent:
    type: agent
    description: Forensics agent that reproduces the stack trace and inspects AST
  forge_agent:
    type: agent
    description: Coding agent that synthesizes the patch and runs unittest
  guard_agent:
    type: agent
    description: Switch Trust guardrail auditor and hot-reload deployer
  traceback_brief:
    type: string
    multiline: true
    description: Production stack trace and failing request payload
room:
  name: "Mend Hotfix: {incident_id}"
  description: "Multi-agent incident triage, surgical patch synthesis, and Switch Trust human-gated hotfix deployment."
  channel_type: channel_private
  agents: ["{recon_agent}", "{forge_agent}", "{guard_agent}"]
  users: ["{$creator}"]
  instructions: |
    This room resolves production incident {incident_id}.
    1. {recon_agent} isolates the failing AST node and function from the traceback brief.
    2. {forge_agent} produces a minimal unified diff and verifies all tests pass (`python3 -m unittest discover -s tests -v`).
    3. {guard_agent} runs Switch Trust static AST & DLP guardrails and waits for {$creator}'s explicit approval (`ship it`) before deploying the hotfix and replaying the failed transaction.

    Incident Traceback & Payload Brief:
    {traceback_brief}
kickoff: |
  @{recon_agent} @{forge_agent} @{guard_agent} — kicking off live hotfix workflow for {incident_id}.

  @{recon_agent}: inspect the AST for the traceback in the room instructions and hand off the exact file, function, and line number to @{forge_agent}.

  @{forge_agent}: generate the unified diff, run the unittest suite, and hand the verified patch to @{guard_agent}.

  @{guard_agent}: audit the diff with Switch Trust guardrails and ping {$creator} for final deployment approval.

